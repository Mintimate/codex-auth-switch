name: 发布安装包

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: build-installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: 检查发布版本
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 读取并检查版本
        id: version
        shell: bash
        run: |
          app_version="$(jq -r '.version' src-tauri/tauri.conf.json)"
          release_tag="v${app_version}"

          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_NAME}" != "${release_tag}" ]]; then
            echo "::error::Git 标签 ${GITHUB_REF_NAME} 与应用版本 ${release_tag} 不一致"
            exit 1
          fi

          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"

  build:
    name: ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-latest
            args: --target aarch64-apple-darwin --bundles dmg
            rust_targets: aarch64-apple-darwin
            cache_key: macos-aarch64
            apple_signing_identity: "-"
            asset_os: macOS
            asset_arch: arm64
          - name: macOS Intel
            platform: macos-latest
            args: --target x86_64-apple-darwin --bundles dmg
            rust_targets: x86_64-apple-darwin
            cache_key: macos-x86_64
            apple_signing_identity: "-"
            asset_os: macOS
            asset_arch: x64
          - name: Windows x64
            platform: windows-latest
            args: --bundles msi,nsis
            rust_targets: ""
            cache_key: windows-x86_64
            apple_signing_identity: ""
            asset_os: Windows
            asset_arch: x64
          - name: Linux x64
            platform: ubuntu-22.04
            args: --bundles deb,rpm,appimage
            rust_targets: ""
            cache_key: linux-x86_64
            apple_signing_identity: ""
            asset_os: Linux
            asset_arch: x64

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Linux 构建依赖
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: ${{ matrix.cache_key }}

      - name: 安装前端依赖
        run: npm ci

      - name: 构建并上传安装产物
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.apple_signing_identity }}
        with:
          tauriScript: npm run tauri
          args: ${{ matrix.args }}
          tagName: ${{ needs.prepare.outputs.release_tag }}
          releaseName: Codex Auth Switch ${{ needs.prepare.outputs.release_tag }}
          releaseBody: 下载与你的系统和架构对应的安装包。macOS 产物使用 ad-hoc 签名，首次运行时可能需要在“隐私与安全性”中确认打开。
          releaseDraft: false
          prerelease: ${{ contains(needs.prepare.outputs.release_tag, '-') }}
          releaseAssetNamePattern: Codex-Auth-Switch_[version]_${{ matrix.asset_os }}_${{ matrix.asset_arch }}[setup][ext]
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: Codex-Auth-Switch-[version]-${{ matrix.asset_os }}-${{ matrix.asset_arch }}-[bundle]

  cleanup:
    name: 清理旧命名产物
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    steps:
      - name: 删除旧命名的安装产物
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        shell: bash
        run: |
          gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name' |
            while IFS= read -r asset_name; do
              case "${asset_name}" in
                codex-auth-switch-*)
                  gh release delete-asset "${RELEASE_TAG}" "${asset_name}" --repo "${GITHUB_REPOSITORY}" --yes
                  ;;
              esac
            done
