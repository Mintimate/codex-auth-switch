name: 发布安装包

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: build-installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: 检查发布版本
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 读取并检查版本
        id: version
        shell: bash
        run: |
          app_version="$(jq -r '.version' src-tauri/tauri.conf.json)"
          release_tag="v${app_version}"

          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_NAME}" != "${release_tag}" ]]; then
            echo "::error::Git 标签 ${GITHUB_REF_NAME} 与应用版本 ${release_tag} 不一致"
            exit 1
          fi

          if git rev-parse --verify --quiet "refs/tags/${release_tag}" > /dev/null; then
            previous_tag="$(git describe --tags --abbrev=0 "${release_tag}^" 2>/dev/null || true)"
          else
            previous_tag="$(git describe --tags --abbrev=0 HEAD 2>/dev/null || true)"
          fi
          release_body="$(
            bash .github/scripts/generate-release-notes.sh \
              "${release_tag}" "${previous_tag}"
          )"

          delimiter="release-body-${RANDOM}-${RANDOM}"
          {
            echo "release_body<<${delimiter}"
            echo "${release_body}"
            echo "${delimiter}"
          } >> "${GITHUB_OUTPUT}"
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"

      - name: 验证 updater 清单生成器
        run: node --test .github/scripts/generate-updater-manifest.test.mjs

      - name: 创建或重置草稿 Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BODY: ${{ steps.version.outputs.release_body }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        shell: bash
        run: |
          release_pages="$(gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100")"
          release_count="$(jq -r --arg tag "${RELEASE_TAG}" \
            '[.[][] | select(.tag_name == $tag)] | length' <<<"${release_pages}")"

          if [[ "${release_count}" -gt 1 ]]; then
            echo "::error::标签 ${RELEASE_TAG} 对应多个 Release"
            exit 1
          fi

          prerelease=false
          if [[ "${RELEASE_TAG}" == *-* ]]; then
            prerelease=true
          fi

          if [[ "${release_count}" -eq 0 ]]; then
            release_json="$(jq -n \
              --arg tag "${RELEASE_TAG}" \
              --arg name "${RELEASE_TAG}" \
              --arg body "${RELEASE_BODY}" \
              --arg target "${GITHUB_SHA}" \
              --argjson prerelease "${prerelease}" \
              '{
                tag_name: $tag,
                target_commitish: $target,
                name: $name,
                body: $body,
                draft: true,
                prerelease: $prerelease
              }' |
              gh api --method POST \
                "repos/${GITHUB_REPOSITORY}/releases" --input -)"
          else
            release_json="$(jq -cer --arg tag "${RELEASE_TAG}" \
              '.[][] | select(.tag_name == $tag)' <<<"${release_pages}")"
            if ! jq -e '.draft == true' <<<"${release_json}" >/dev/null; then
              echo "::error::Release ${RELEASE_TAG} 已公开，拒绝覆盖"
              exit 1
            fi

            release_id="$(jq -r '.id' <<<"${release_json}")"
            release_json="$(jq -n \
              --arg name "${RELEASE_TAG}" \
              --arg body "${RELEASE_BODY}" \
              --argjson prerelease "${prerelease}" \
              '{name: $name, body: $body, draft: true, prerelease: $prerelease}' |
              gh api --method PATCH \
                "repos/${GITHUB_REPOSITORY}/releases/${release_id}" --input -)"

            jq -r '.assets[].id' <<<"${release_json}" |
              while read -r asset_id; do
                gh api --method DELETE \
                  "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
              done
          fi

          echo "release_id=$(jq -r '.id' <<<"${release_json}")" >> "${GITHUB_OUTPUT}"

  build:
    name: ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-latest
            args: --target aarch64-apple-darwin --bundles app,dmg
            rust_targets: aarch64-apple-darwin
            cache_key: macos-aarch64
            apple_signing_identity: "-"
            asset_os: macOS
            asset_arch: arm64
          - name: macOS Intel
            platform: macos-latest
            args: --target x86_64-apple-darwin --bundles app,dmg
            rust_targets: x86_64-apple-darwin
            cache_key: macos-x86_64
            apple_signing_identity: "-"
            asset_os: macOS
            asset_arch: x64
          - name: Windows x64
            platform: windows-latest
            args: --bundles msi,nsis
            rust_targets: ""
            cache_key: windows-x86_64
            apple_signing_identity: ""
            asset_os: Windows
            asset_arch: x64
          - name: Linux x64
            platform: ubuntu-22.04
            args: --bundles deb,rpm,appimage
            rust_targets: ""
            cache_key: linux-x86_64
            apple_signing_identity: ""
            asset_os: Linux
            asset_arch: x64

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Linux 构建依赖
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: ${{ matrix.cache_key }}

      - name: 安装前端依赖
        run: npm ci

      - name: 编译 macOS 明暗图标资源
        if: startsWith(matrix.platform, 'macos-')
        shell: bash
        run: |
          icon_output="${RUNNER_TEMP}/codex-icon-assets"
          mkdir -p "${icon_output}"

          xcrun actool src-tauri/icons/Assets.xcassets \
            --compile "${icon_output}" \
            --output-format human-readable-text \
            --notices \
            --warnings \
            --output-partial-info-plist "${icon_output}/assetcatalog_generated_info.plist" \
            --app-icon AppIcon \
            --include-all-app-icons \
            --enable-on-demand-resources NO \
            --development-region en \
            --target-device mac \
            --minimum-deployment-target 12.0 \
            --platform macosx

          test -f "${icon_output}/Assets.car"
          test -f "${icon_output}/assetcatalog_generated_info.plist"
          test "$(plutil -extract CFBundleIconName raw -o - \
            "${icon_output}/assetcatalog_generated_info.plist")" = "AppIcon"

          assetutil --info "${icon_output}/Assets.car" > "${icon_output}/assets-info.json"
          jq -e 'any(.[]; .AssetType == "Icon Image" and .Name == "AppIcon")' \
            "${icon_output}/assets-info.json"

          jq \
            --arg assets_car "${icon_output}/Assets.car" \
            --arg icon_plist "${icon_output}/assetcatalog_generated_info.plist" \
            '
              .bundle.resources = (
                if .bundle.resources == null then
                  {($assets_car): "Assets.car"}
                elif (.bundle.resources | type) == "object" then
                  .bundle.resources + {($assets_car): "Assets.car"}
                else
                  error("bundle.resources 必须使用对象形式才能设置 Assets.car 的目标路径")
                end
              )
              | .bundle.macOS.infoPlist = $icon_plist
            ' \
            src-tauri/tauri.conf.json > "${RUNNER_TEMP}/tauri.conf.json"
          mv "${RUNNER_TEMP}/tauri.conf.json" src-tauri/tauri.conf.json

          jq -e \
            --arg assets_car "${icon_output}/Assets.car" \
            --arg icon_plist "${icon_output}/assetcatalog_generated_info.plist" \
            '
              .bundle.resources[$assets_car] == "Assets.car"
              and .bundle.macOS.infoPlist == $icon_plist
            ' \
            src-tauri/tauri.conf.json

      - name: 构建并上传安装产物
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.apple_signing_identity }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: npm run tauri
          args: ${{ matrix.args }}
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tagName: ${{ needs.prepare.outputs.release_tag }}
          releaseDraft: true
          prerelease: ${{ contains(needs.prepare.outputs.release_tag, '-') }}
          # 各平台只上传唯一命名的安装包和签名，latest.json 在所有构建结束后统一生成。
          uploadUpdaterJson: false
          uploadUpdaterSignatures: true
          releaseAssetNamePattern: Codex-Auth-Switch_[version]_${{ matrix.asset_os }}_${{ matrix.asset_arch }}[setup][ext]

  publish:
    name: 验证并发布更新
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    steps:
      - name: 检出发布脚本
        uses: actions/checkout@v7

      - name: 下载签名并生成 updater 清单
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        shell: bash
        run: |
          manifest_dir="${RUNNER_TEMP}/updater-manifest"
          signature_dir="${manifest_dir}/signatures"
          mkdir -p "${signature_dir}"

          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            > "${manifest_dir}/release.json"
          jq -e --arg tag "${RELEASE_TAG}" \
            '.draft == true and .tag_name == $tag' \
            "${manifest_dir}/release.json"

          jq -r '
            .assets[]
            | select((.label // .name) | endswith(".sig"))
            | [.id, (.label // .name)]
            | @tsv
          ' "${manifest_dir}/release.json" |
            while IFS=$'\t' read -r asset_id asset_name; do
              if [[ "${asset_name}" == */* || "${asset_name}" == *..* ]]; then
                echo "::error::非法签名文件名：${asset_name}"
                exit 1
              fi
              gh api \
                -H 'Accept: application/octet-stream' \
                "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
                > "${signature_dir}/${asset_name}"
            done

          app_version="${RELEASE_TAG#v}"
          node .github/scripts/generate-updater-manifest.mjs \
            "${app_version}" \
            "${RELEASE_TAG}" \
            "${manifest_dir}/release.json" \
            "${signature_dir}" \
            "${manifest_dir}/latest.json"

          gh release upload "${RELEASE_TAG}" \
            "${manifest_dir}/latest.json" --clobber

      - name: 验证 updater 清单与签名产物
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        shell: bash
        run: |
          release_json="$(gh api \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}")"
          jq -e --arg tag "${RELEASE_TAG}" \
            '.draft == true and .tag_name == $tag' <<<"${release_json}"

          manifest_dir="${RUNNER_TEMP}/updater-manifest"
          manifest="${manifest_dir}/latest.json"
          manifest_asset_id="$(jq -er '
            [.assets[] | select(.name == "latest.json")]
            | if length == 1 then .[0].id else error("没有找到唯一的 latest.json") end
          ' <<<"${release_json}")"
          gh api \
            -H 'Accept: application/octet-stream' \
            "repos/${GITHUB_REPOSITORY}/releases/assets/${manifest_asset_id}" \
            > "${manifest}"

          expected_version="${RELEASE_TAG#v}"
          jq -e --arg version "${expected_version}" \
            '.version == $version and (.platforms | type == "object")' \
            "${manifest}"

          required_platforms=(
            darwin-aarch64
            darwin-aarch64-app
            darwin-x86_64
            darwin-x86_64-app
            linux-x86_64
            linux-x86_64-appimage
            linux-x86_64-deb
            linux-x86_64-rpm
            windows-x86_64
            windows-x86_64-nsis
            windows-x86_64-msi
          )
          for platform in "${required_platforms[@]}"; do
            jq -e --arg platform "${platform}" '
              .platforms[$platform] as $entry
              | ($entry | type == "object")
                and ($entry.url | type == "string" and length > 0)
                and ($entry.signature | type == "string" and length > 0)
            ' "${manifest}"
          done

          jq -e '
            ([.assets[].name | select(endswith(".app.tar.gz"))] | length) == 2
            and ([.assets[].name | select(endswith(".app.tar.gz.sig"))] | length) == 2
            and ([.assets[].name | select(endswith(".dmg"))] | length) == 2
            and ([.assets[].name | select(endswith(".msi"))] | length) == 1
            and ([.assets[].name | select(endswith(".msi.sig"))] | length) == 1
            and ([.assets[].name | select(endswith("-setup.exe"))] | length) == 1
            and ([.assets[].name | select(endswith("-setup.exe.sig"))] | length) == 1
            and ([.assets[].name | select(endswith(".AppImage"))] | length) == 1
            and ([.assets[].name | select(endswith(".AppImage.sig"))] | length) == 1
            and ([.assets[].name | select(endswith(".deb"))] | length) == 1
            and ([.assets[].name | select(endswith(".deb.sig"))] | length) == 1
            and ([.assets[].name | select(endswith(".rpm"))] | length) == 1
            and ([.assets[].name | select(endswith(".rpm.sig"))] | length) == 1
          ' <<<"${release_json}"

      - name: 公开已验证的 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        shell: bash
        run: |
          release_json="$(gh api \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}")"
          jq -e --arg tag "${RELEASE_TAG}" \
            '.draft == true and .tag_name == $tag' <<<"${release_json}"

          if [[ "${RELEASE_TAG}" == *-* ]]; then
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
              -F draft=false \
              -F prerelease=true \
              -f make_latest=false
          else
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
              -F draft=false \
              -F prerelease=false \
              -f make_latest=true
          fi
