name: 同步 CNB 版本发布

on:
  workflow_run:
    workflows:
      - 发布安装包
    types:
      - completed
  workflow_dispatch:
    inputs:
      release_tag:
        description: 要同步的 GitHub Release 标签，例如 v0.6.2
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sync-cnb-release-${{ github.event.workflow_run.head_branch || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  sync:
    name: 同步 Tag 与安装包
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      CNB_REPO: Mintimate/tool-forge/codex-auth-switch
      RELEASE_TAG: ${{ github.event.workflow_run.head_branch || inputs.release_tag }}
    steps:
      - name: 确定源码提交
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          source_sha="${{ github.event.workflow_run.head_sha }}"
          if [[ -z "${source_sha}" ]]; then
            source_sha="$(gh api \
              "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" \
              --jq '.object.sha')"
          fi
          echo "sha=${source_sha}" >> "${GITHUB_OUTPUT}"

      - name: 检出同步脚本
        uses: actions/checkout@v7
        with:
          path: automation

      - name: 检出发布源码与完整 Git 历史
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: source
          ref: ${{ steps.source.outputs.sha }}

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: 检查标签与 CNB 凭据
        env:
          CNB_GIT_PASSWORD: ${{ secrets.CNB_GIT_PASSWORD }}
        shell: bash
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9] ]]; then
            echo "::error::无法从上游工作流确定版本标签：${RELEASE_TAG}"
            exit 1
          fi
          if [[ -z "${CNB_GIT_PASSWORD}" ]]; then
            echo "::error::请先配置 Actions Secret：CNB_GIT_PASSWORD"
            exit 1
          fi
          git -C source fetch --force origin \
            "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"

      - name: 同步 Git 标签到 CNB
        env:
          CNB_GIT_PASSWORD: ${{ secrets.CNB_GIT_PASSWORD }}
        shell: bash
        run: |
          askpass="${RUNNER_TEMP}/cnb-git-askpass.sh"
          cat > "${askpass}" <<'EOF'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf '%s\n' 'cnb' ;;
            *Password*) printf '%s\n' "${CNB_GIT_PASSWORD}" ;;
          esac
          EOF
          chmod 700 "${askpass}"

          GIT_ASKPASS="${askpass}" GIT_TERMINAL_PROMPT=0 \
            git -C source push --force \
            "https://cnb.cool/Mintimate/tool-forge/codex-auth-switch.git" \
            "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"

      - name: 下载 GitHub Release 元数据与附件
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/cnb-release-assets"
          gh release view "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json name,body,isPrerelease \
            > "${RUNNER_TEMP}/github-release.json"
          gh api \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            > "${RUNNER_TEMP}/github-release-api.json"
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir "${RUNNER_TEMP}/cnb-release-assets"

          manifest="${RUNNER_TEMP}/cnb-release-assets/latest.json"
          jq \
            --arg cnb_repo "${CNB_REPO}" \
            --arg tag "${RELEASE_TAG}" \
            --slurpfile release "${RUNNER_TEMP}/github-release-api.json" \
            '
              ($release[0].assets
                | map({ key: .url, value: .name })
                | from_entries) as $asset_names
              | .platforms |= with_entries(
                  .value.url as $source_url
                  | ($asset_names[$source_url]
                    // error("找不到更新包对应的 GitHub Release 附件：\($source_url)")) as $asset_name
                  | .value.url = (
                      "https://cnb.cool/" + $cnb_repo
                      + "/-/releases/download/" + ($tag | @uri)
                      + "/" + ($asset_name | @uri)
                    )
                )
            ' \
            "${manifest}" > "${RUNNER_TEMP}/latest-cnb.json"
          mv "${RUNNER_TEMP}/latest-cnb.json" "${manifest}"

          jq -e \
            --arg prefix "https://cnb.cool/${CNB_REPO}/-/releases/download/${RELEASE_TAG}/" \
            '
              (.platforms | type == "object" and length > 0)
              and all(.platforms[].url; startswith($prefix))
            ' \
            "${manifest}"

      - name: 创建 CNB Release 并上传附件
        env:
          CNB_TOKEN: ${{ secrets.CNB_GIT_PASSWORD }}
          RELEASE_NAME: ${{ env.RELEASE_TAG }}
          RELEASE_ASSETS_DIR: ${{ runner.temp }}/cnb-release-assets
        shell: bash
        run: |
          export RELEASE_NAME="$(jq -r '.name' "${RUNNER_TEMP}/github-release.json")"
          export RELEASE_PRERELEASE="$(jq -r '.isPrerelease' "${RUNNER_TEMP}/github-release.json")"
          export RELEASE_BODY="$(jq -r '.body // ""' "${RUNNER_TEMP}/github-release.json")"
          bash automation/.github/scripts/sync-cnb-release.sh
