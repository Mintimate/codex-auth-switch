name: 同步到 CNB

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-to-cnb
  cancel-in-progress: false

jobs:
  sync:
    name: 推送镜像仓库
    runs-on: ubuntu-latest
    steps:
      - name: 检出完整仓库
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 检查 CNB 凭据
        env:
          CNB_GIT_PASSWORD: ${{ secrets.CNB_GIT_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "${CNB_GIT_PASSWORD}" ]]; then
            echo "::error::请先配置 Actions Secret：CNB_GIT_PASSWORD"
            exit 1
          fi

      - name: 同步 main 与版本标签
        env:
          CNB_GIT_PASSWORD: ${{ secrets.CNB_GIT_PASSWORD }}
        shell: bash
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" \
            -w "${GITHUB_WORKSPACE}" \
            -e PLUGIN_TARGET_URL="https://cnb.cool/Mintimate/tool-forge/codex-auth-switch.git" \
            -e PLUGIN_AUTH_TYPE="https" \
            -e PLUGIN_USERNAME="cnb" \
            -e PLUGIN_PASSWORD="${CNB_GIT_PASSWORD}" \
            -e PLUGIN_BRANCH="main" \
            -e PLUGIN_GIT_USER="cnb" \
            -e PLUGIN_GIT_EMAIL="cnb@cnb.cool" \
            -e PLUGIN_FORCE="true" \
            tencentcom/git-sync

          askpass="${RUNNER_TEMP}/cnb-git-askpass.sh"
          cat > "${askpass}" <<'EOF'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf '%s\n' 'cnb' ;;
            *Password*) printf '%s\n' "${CNB_GIT_PASSWORD}" ;;
          esac
          EOF
          chmod 700 "${askpass}"

          GIT_ASKPASS="${askpass}" GIT_TERMINAL_PROMPT=0 \
            git push --force --tags \
            "https://cnb.cool/Mintimate/tool-forge/codex-auth-switch.git"
